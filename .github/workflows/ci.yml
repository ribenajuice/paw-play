name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle / Android (Kotlin + Compose) project. Uses a system Gradle
      # install rather than the wrapper — see docs/ARCHITECTURE.md's release
      # notes on why gradlew isn't committed.
      - name: Setup JDK
        if: ${{ hashFiles('settings.gradle.kts') != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        if: ${{ hashFiles('settings.gradle.kts') != '' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
      - name: Lint, unit test, assemble debug (Gradle)
        if: ${{ hashFiles('settings.gradle.kts') != '' }}
        run: gradle lintDebug testDebugUnitTest assembleDebug

      # Godot project (kept as a fallback path — see architect ADR on engine choice)
      - name: Import & headless check (Godot)
        if: ${{ hashFiles('project.godot') != '' }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.x
      - name: Godot import + script check
        if: ${{ hashFiles('project.godot') != '' }}
        run: godot --headless --import --quit

      - name: No project scaffolded yet
        if: ${{ hashFiles('settings.gradle.kts') == '' && hashFiles('project.godot') == '' }}
        run: echo "No settings.gradle.kts or project.godot found — skipping (run /kickoff to scaffold)."
